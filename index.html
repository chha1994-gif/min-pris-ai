<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>MinPris – tilbudskalkulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f4f6fb;
      padding: 16px;
    }
    .box {
      max-width: 760px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .title { text-align: center; margin-bottom: 24px; }
    label { font-weight: 600; display: block; margin-top: 14px; }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
    .dark { background:#111827; color:white; }
    .blue { background:#2563eb; color:white; }
    .success { background:#16a34a; color:white; }
    .gray { background:#e5e7eb; }

    pre {
      background:#f1f5f9;
      padding:14px;
      border-radius:10px;
      white-space:pre-wrap;
      margin-top:10px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-weight: 600;
    }

    .start-new-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .start-new-btn {
      background: #dc2626;
      color: white;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
    }

    .ekstra-item {
      display: grid;
      grid-template-columns: 1fr 110px 36px;
      gap: 8px;
      margin-top: 8px;
    }

    /* ===== PRO MODAL ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal.hidden { display:none; }

    .modal-box {
      background: white;
      padding: 24px;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
  </style>
</head>

<body>
<div class="box">

<h1 class="title">MinPris – tilbudskalkulator</h1>

<label>Arbeidsbeskrivelse</label>
<textarea id="beskrivelse" rows="4"
placeholder="Beskriv jobben, f.eks: bad – 25t riving, 8t sanering"></textarea>

<div class="start-new-row">
  <button class="start-new-btn hidden" id="startNyBtn"
    onclick="startNyBeskrivelse()">Slett og start ny</button>
</div>

<label>Timepris (kr)</label>
<input id="timepris" type="number" />

<label>Firmaadresse</label>
<input id="firmaadresse" />

<label>Kundeadresse</label>
<input id="kundeadresse" />

<div class="checkbox-row">
  <input type="checkbox" id="turRetur" checked />
  <label>Tur / retur</label>
</div>

<button class="blue" onclick="beregnKm()">Beregn kilometer</button>

<label>Kilometer per dag</label>
<input id="kmPerDag" type="number" />

<label>Pris per km (kr)</label>
<input id="prisPerKm" value="15" type="number" />

<label>Bompenger per dag</label>
<input id="bomPerDag" type="number" />

<label>Avfall totalt</label>
<input id="avfall" value="0" type="number" />

<label>Materiell totalt</label>
<input id="materiell" value="0" type="number" />

<label>HMS per dag</label>
<input id="hms" value="0" type="number" />

<div id="ekstraPoster"></div>
<button class="blue" onclick="leggTilEkstraPost()">+ Ekstra post</button>

<button class="dark" onclick="beregn()">Beregn</button>
<button class="blue" id="aiBtn" onclick="genererTilbud()" disabled>
  Generer tilbudstekst
</button>

<h3>Resultat</h3>
<pre id="resultat"></pre>

<h3>Tilbud</h3>
<pre id="tilbud"></pre>

<button class="success" onclick="kopierTilbud()">Kopier tilbud</button>

</div>

<!-- PRO MODAL -->
<div id="proModal" class="modal hidden">
  <div class="modal-box">
    <h2>MinPris Pro</h2>
    <p>Du har brukt gratisgrensen.</p>
    <ul>
      <li>✔ Ubegrenset km-beregning</li>
      <li>✔ Ubegrenset AI-tilbud</li>
      <li>✔ 49 kr / mnd</li>
    </ul>
    <button class="blue" onclick="fortsettTilStripe()">Oppgrader til Pro</button>
    <button class="gray" onclick="lukkProModal()">Ikke nå</button>
  </div>
</div>

<script>
let kalkyle=null, ekstraPoster=[], proSource=null;

/* ===== PRO / STRIPE ===== */
function harPro(){ return localStorage.getItem("minpris_pro")==="1"; }
function gratisBrukt(t){ return localStorage.getItem("minpris_free_"+t)==="1"; }
function merkGratisBrukt(t){ localStorage.setItem("minpris_free_"+t,"1"); }

async function startStripeCheckout(source){
  const r=await fetch("/api/stripe/checkout",{method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({source})});
  const d=await r.json();
  location.href=d.url;
}
if(new URLSearchParams(location.search).get("pro"))
  localStorage.setItem("minpris_pro","1");

/* ===== PRO MODAL ===== */
function visProModal(s){ proSource=s; proModal.classList.remove("hidden"); }
function lukkProModal(){ proModal.classList.add("hidden"); proSource=null; }
function fortsettTilStripe(){ if(proSource) startStripeCheckout(proSource); }

/* ===== AUTOLAGRING ===== */
const b=beskrivelse, btn=startNyBtn;
b.value=localStorage.getItem("minpris_beskrivelse")||"";
b.oninput=()=>{localStorage.setItem("minpris_beskrivelse",b.value);
btn.classList.toggle("hidden",!b.value);}
function startNyBeskrivelse(){
  if(confirm("Slette beskrivelse?")){
    b.value=""; localStorage.removeItem("minpris_beskrivelse");
    btn.classList.add("hidden");
  }
}

/* ===== KM ===== */
async function beregnKm(){
  if(!harPro()){
    if(gratisBrukt("km")) return visProModal("km");
    merkGratisBrukt("km");
  }
  const r=await fetch("/api/route",{method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({start:firmaadresse.value,end:kundeadresse.value})});
  const d=await r.json();
  let km=d.km; if(turRetur.checked) km*=2;
  kmPerDag.value=km.toFixed(1);
}

/* ===== BEREGNING ===== */
function beregn(){
  const timer=(b.value.match(/(\d+)\s*t/gi)||[])
    .map(x=>+x.replace(/\D/g,"")).reduce((a,b)=>a+b,0);
  const dager=Math.max(1,Math.ceil(timer/7.5));
  const arbeid=timer*(+timepris.value||0);
  const kj=dager*(+kmPerDag.value||0)*(+prisPerKm.value||0);
  const bom=dager*(+bomPerDag.value||0);
  const h=dager*(+hms.value||0);
  const tot=arbeid+kj+bom+h+(+avfall.value||0)+(+materiell.value||0);
  kalkyle={beskrivelse:b.value,timer,dager,totalEksMva:tot,totalInkMva:tot*1.25};
  resultat.textContent=`Sum eks mva: ${tot} kr\nInkl mva: ${tot*1.25} kr`;
  aiBtn.disabled=false;
}

/* ===== AI ===== */
async function genererTilbud(){
  if(!harPro()){
    if(gratisBrukt("ai")) return visProModal("ai");
    merkGratisBrukt("ai");
  }
  tilbud.textContent="Genererer…";
  const r=await fetch("/api/ai",{method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(kalkyle)});
  const d=await r.json();
  tilbud.textContent=d.text||"Ingen tekst";
}

function kopierTilbud(){
  navigator.clipboard.writeText(tilbud.textContent);
}
</script>

</body>
</html>
