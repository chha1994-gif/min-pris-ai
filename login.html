<!DOCTYPE html>
<html>
<head>
  <title>Logger inn...</title>
</head>
<body>
  <h2>Logger inn…</h2>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      document.body.innerHTML = "<h2>Ugyldig magic link</h2>";
    } else {
      fetch("/api/verify-magic?token=" + encodeURIComponent(token.trim()))
        .then(r => r.json())
        .then(data => {
          if (!data.valid) {
            document.body.innerHTML = "<h2>Linken er utløpt</h2>";
            return;
          }

          // ✅ Lagre login state
          localStorage.setItem("restoreEmail", data.email);

          // Hent Pro-status
          fetch("/api/check-pro?email=" + encodeURIComponent(data.email))
            .then(r => r.json())
            .then(proData => {
              if (proData.pro) {
                localStorage.setItem("minpris_pro", "true");
              }

              window.location.href = "/";
            });
        })
        .catch(() => {
          document.body.innerHTML = "<h2>Noe gikk galt</h2>";
        });
    }
  </script>
</body>
</html>
