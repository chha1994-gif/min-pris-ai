<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Logger inn...</title>
</head>
<body>
  <h2>Logger inn…</h2>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      document.body.innerHTML = "<h2>Ugyldig magic link</h2>";
    } else {

      fetch("/api/verify-magic", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      })
      .then(r => r.json())
      .then(data => {
        if (!data.valid) {
          document.body.innerHTML = "<h2>Magic link utløpt</h2>";
          return;
        }

        const email = data.email;

        localStorage.setItem("restoreEmail", email);

        fetch("/api/check-pro?email=" + encodeURIComponent(email))
          .then(r => r.json())
          .then(proData => {
            const pro = proData.pro ? "true" : "false";

            localStorage.setItem("minpris_pro", pro);

            document.cookie =
              "minpris_pro=" + pro +
              "; path=/; max-age=31536000; SameSite=Lax";

            window.location.href = "/";
          });
      })
      .catch(() => {
        document.body.innerHTML = "<h2>Noe gikk galt</h2>";
      });
    }
  </script>
</body>
</html>
