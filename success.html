<!DOCTYPE html>
<html>
<head>
  <title>Betaling fullført</title>
</head>
<body>
  <h2>✅ Betaling fullført</h2>
  <p>Aktiverer Pro...</p>

<script>
const params = new URLSearchParams(window.location.search);
const sessionId = params.get("session_id");

if (sessionId && !sessionStorage.getItem("restore_attempted")) {
  sessionStorage.setItem("restore_attempted", "true");

  fetch("/api/restore-pro", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sessionId })
  })
  .then(res => res.json())
  .then(data => {
    if (data.pro) {
      document.cookie = "minpris_pro=true; path=/; max-age=31536000";
      localStorage.setItem("minpris_pro", "true");
      localStorage.setItem("stripeCustomerId", data.customerId);
    }

    window.location.href = "/";
  })
  .catch(() => {
    window.location.href = "/";
  });
}
</script>

</body>
</html>
