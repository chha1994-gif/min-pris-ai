<!DOCTYPE html>
<html>
<head>
  <title>Betaling fullført</title>
  
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <h2>✅ Betaling fullført</h2>
  <p>Aktiverer Pro...</p>

<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get("session_id");

  if (!sessionId) {
    window.location.href = "/";
    return;
  }

  try {
    const res = await fetch("/api/restore-pro", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  credentials: "include",
  body: JSON.stringify({ sessionId })
});

    const data = await res.json();

    if (data.pro && data.customerId) {
      // Lagre customer
      localStorage.setItem("stripeCustomerId", data.customerId);

      // Midlertidig fallback
      localStorage.setItem("minpris_pro", "1");

      document.cookie =
        "stripeCustomerId=" + data.customerId +
        "; path=/; max-age=31536000; Secure; SameSite=Lax";
    }

  } catch (err) {
    console.error("Restore error:", err);
  }

  window.location.href = "/";
})();
</script>
